<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>Sales Navigator RAG 파이프라인</title>
<desc>셀러 질문이 BM25 검색, 사전 차단 가드레일, Claude, 인용 검증을 거쳐 출처가 붙은 답변 또는 거절로 끝나는 흐름</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" rx="12" fill="#FFFFFF"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="120" y="58" fill="#2C2C2A" font-weight="500">골든셋</text><text x="120" y="78" fill="#5F5E5A" font-size="12">30문항</text>
<rect x="250" y="46" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="350" y="68" fill="#2C2C2A" font-weight="500">셀러 질문</text>
<rect x="40" y="136" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="120" y="154" fill="#2C2C2A" font-weight="500">코퍼스 인덱스</text><text x="120" y="174" fill="#5F5E5A" font-size="12">공식 문서 14개, 청크 289개</text>
<rect x="230" y="136" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="350" y="154" fill="#3C3489" font-weight="500">BM25 검색 (상위 8개)</text><text x="350" y="174" fill="#534AB7" font-size="12">별칭 · RHEL 버전 · 제품 부스트</text>
<rect x="230" y="232" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="350" y="250" fill="#712B13" font-weight="500">사전 차단 가드레일</text><text x="350" y="270" fill="#993C1D" font-size="12">가격 · 범위 밖 · 근거 부족</text>
<rect x="230" y="328" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="350" y="346" fill="#3C3489" font-weight="500">Claude Opus 5.5</text><text x="350" y="366" fill="#534AB7" font-size="12">발췌문 안에서만 답변</text>
<rect x="230" y="424" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="350" y="442" fill="#712B13" font-weight="500">인용 검증 가드레일</text><text x="350" y="462" fill="#993C1D" font-size="12">인용 없는 문장 · 가짜 출처 제거</text>
<rect x="250" y="520" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="350" y="542" fill="#2C2C2A" font-weight="500">출처가 붙은 답변</text>
<rect x="510" y="328" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="575" y="346" fill="#2C2C2A" font-weight="500">거절</text><text x="575" y="366" fill="#5F5E5A" font-size="12">사유 기록</text>
