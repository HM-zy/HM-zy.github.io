<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">문서 청킹부터 답변까지</title>
<desc id="desc">문서를 조각으로 나누어 저장소에 보관하고, 사용자 질문과 관련된 조각만 검색해 AI 모델에 넣어 답변을 만드는 과정.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#425466" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill:#18212b }
    .title { font-size:30px; font-weight:700 }
    .sub { font-size:17px; fill:#526170 }
    .label { font-size:20px; font-weight:650 }
    .body { font-size:17px }
    .small { font-size:15px; fill:#526170 }
    .box { fill:#fff; stroke:#cbd5df; stroke-width:2 }
    .soft { fill:#f2f6fa; stroke:#cbd5df; stroke-width:2 }
    .accent { fill:#e4f1ff; stroke:#76a9dc; stroke-width:2 }
    .arrow { fill:none; stroke:#425466; stroke-width:2.5; marker-end:url(#arrow) }
    .thin { fill:none; stroke:#8997a5; stroke-width:1.6 }
  </style>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="60" y="62" class="title">문서 조각에서 답변까지</text>
<text x="60" y="94" class="sub">문서는 미리 나눠 저장하고, 질문이 오면 필요한 조각만 골라 모델에 전달합니다.</text>

<!-- Preparation lane -->
<text x="60" y="151" class="small" font-weight="700">미리 준비</text>
<rect x="60" y="175" width="230" height="165" rx="14" class="soft"/>
<text x="84" y="211" class="label">원본 문서</text>
<rect x="86" y="232" width="178" height="82" rx="6" fill="#fff" stroke="#d4dde5"/>
<path d="M103 251h142M103 269h128M103 287h139M103 305h96" class="thin"/>
<text x="175" y="328" text-anchor="middle" class="small">긴 문서</text>

<path d="M305 257H355" class="arrow"/>
<text x="330" y="238" text-anchor="middle" class="small">청킹</text>

<rect x="370" y="175" width="280" height="165" rx="14" class="soft"/>
<text x="394" y="211" class="label">문서 조각</text>
<rect x="394" y="229" width="232" height="28" rx="6" fill="#fff" stroke="#d4dde5"/>
<text x="410" y="249" class="body">조각 1</text>
<rect x="394" y="265" width="232" height="28" rx="6" fill="#fff" stroke="#d4dde5"/>
<text x="410" y="285" class="body">조각 2</text>
<rect x="394" y="301" width="232" height="28" rx="6" fill="#fff" stroke="#d4dde5"/>
<text x="410" y="321" class="body">조각 3</text>

<path d="M665 257H715" class="arrow"/>
<text x="690" y="238" text-anchor="middle" class="small">저장</text>

<rect x="730" y="175" width="400" height="165" rx="14" class="accent"/>
<text x="754" y="211" class="label">저장소</text>
<g transform="translate(758 230)">
  <ellipse cx="54" cy="12" rx="48" ry="12" fill="#fff" stroke="#76a9dc" stroke-width="2"/>
  <path d="M6 12v69c0 7 22 13 48 13s48-6 48-13V12" fill="#fff" stroke="#76a9dc" stroke-width="2"/>
  <path d="M6 35c0 7 22 13 48 13s48-6 48-13M6 58c0 7 22 13 48 13s48-6 48-13" fill="none" stroke="#76a9dc" stroke-width="2"/>
</g>
<text x="892" y="259" class="body">조각 1 · 조각 2 · 조각 3 · …</text>
<text x="892" y="289" class="small">전체 조각을 검색 가능하게 보관</text>
<text x="892" y="315" class="small">질문이 올 때마다 원문 전체를 넣지 않음</text>

<!-- Query lane -->
<text x="60" y="398" class="small" font-weight="700">질문이 들어오면</text>
<rect x="60" y="422" width="280" height="125" rx="14" class="soft"/>
<text x="84" y="458" class="label">사용자 질문</text>
<text x="84" y="494" class="body">“환각 방지에 중요한</text>
<text x="84" y="520" class="body">역량은 무엇인가요?”</text>

<path d="M355 484H420" class="arrow"/>
<text x="388" y="462" text-anchor="middle" class="small">질문으로</text>
<text x="388" y="480" text-anchor="middle" class="small">검색</text>

<rect x="435" y="422" width="275" height="125" rx="14" class="accent"/>
<text x="459" y="458" class="label">관련 조각 찾기</text>
<rect x="459" y="475" width="227" height="48" rx="8" fill="#fff" stroke="#76a9dc" stroke-width="2"/>
<text x="475" y="505" class="body">조각 2만 선택</text>

<!-- Retrieval from the store, curved down to the selected chunk -->
<path d="M930 351 C930 390 780 389 710 451" class="arrow"/>
<text x="845" y="385" text-anchor="middle" class="small">저장소에서 관련 조각 검색</text>

<path d="M725 484H780" class="arrow"/>
<text x="752" y="462" text-anchor="middle" class="small">질문 +</text>
<text x="752" y="480" text-anchor="middle" class="small">조각 2</text>

<rect x="795" y="422" width="180" height="125" rx="14" class="soft"/>
<text x="819" y="458" class="label">AI 모델</text>
<rect x="819" y="475" width="132" height="48" rx="8" fill="#fff" stroke="#d4dde5"/>
<text x="885" y="505" text-anchor="middle" class="body">입력 문맥</text>

<path d="M990 484H1035" class="arrow"/>
<text x="1012" y="462" text-anchor="middle" class="small">생성</text>

<rect x="1050" y="422" width="100" height="125" rx="14" class="accent"/>
<text x="1070" y="458" class="label">답변</text>
<path d="M1072 482h56M1072 500h56M1072 518h38" class="thin"/>
<text x="60" y="612" class="sub">핵심: 저장소에는 문서 조각 전체가 있지만, 모델에는 검색된 일부 조각만 전달됩니다.</text>
</svg>